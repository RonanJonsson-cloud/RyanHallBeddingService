name: CI

on:
  push:
    branches: [main, Cloud-Database-potential-main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Not `npm ci`: AWS's @aws-amplify/data-construct ships bundled
      # packages whose versions don't match, which `npm ci` rejects. `npm install`
      # still installs the versions in package-lock.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check backend types
        run: npx tsc -p amplify

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
